name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Export and validate GitHub Pages site
        run: |
          npm run export:github-pages -- /tmp/github-pages-export
          npm run validate:github-pages -- /tmp/github-pages-export
          mkdir -p english-static-output/assets czech-magic-static-output/assets czech-magic-static-output/explorer
          cp -R /tmp/github-pages-export/en english-static-output/en
          cp -R /tmp/github-pages-export/explorer/magie czech-magic-static-output/explorer/magie
          cp -R /tmp/github-pages-export/assets/magic czech-magic-static-output/assets/magic
          cp /tmp/github-pages-export/assets/*.css english-static-output/assets/
          cp /tmp/github-pages-export/assets/*.css czech-magic-static-output/assets/
          cp /tmp/github-pages-export/static.js english-static-output/static.js
          cp /tmp/github-pages-export/static.js czech-magic-static-output/static.js
      - name: Save Czech magic pages for deployment
        uses: actions/upload-artifact@v4
        with:
          name: czech-magic-static-output
          path: czech-magic-static-output/
          if-no-files-found: error
          retention-days: 7

      - name: Save English static pages for deployment
        uses: actions/upload-artifact@v4
        with:
          name: english-static-output
          path: english-static-output/
          if-no-files-found: error
          retention-days: 7
